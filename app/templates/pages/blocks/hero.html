{% load static %}
<section class="page-block page-block--hero align-{{ props.alignment|default:'center' }}">
  <div class="page-block__background" style="{% if props.background_image_resolved %}background-image:linear-gradient(rgba(0,0,0,{{ props.overlay|default:0.4 }}), rgba(0,0,0,{{ props.overlay|default:0.4 }})), url('{{ props.background_image_resolved }}');{% endif %}">
    <div class="page-block__container">
      {% if props.kicker %}<p class="page-hero__kicker">{{ props.kicker }}</p>{% endif %}
      {% if props.title %}<h1 class="page-hero__title">{{ props.title }}</h1>{% endif %}
      {% if props.subtitle %}<p class="page-hero__subtitle">{{ props.subtitle }}</p>{% endif %}
      {% if props.actions %}
        <div class="page-hero__actions">
          {% for action in props.actions %}
            <a
              class="btn btn-{{ action.style|default:'primary' }}"
              href="{{ action.href|default:'#' }}"
              {% if action.new_tab %}target="_blank" rel="noopener"{% endif %}
            >{{ action.label }}</a>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </div>
</section>
